<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Админка — вход</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&display=swap">
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Onest', ui-sans-serif, system-ui, sans-serif;
    background: #F1F7F4;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    color: #182220;
  }
  form {
    background: #fff;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(24,34,32,.06), 0 1px 1px rgba(24,34,32,.04);
    width: 280px;
    border: 1px solid rgba(24,34,32,.1);
  }
  h1 { font-size: 18px; margin: 0 0 16px; }
  input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid rgba(24,34,32,.1);
    background: #E0EFE8;
    border-radius: 12px;
    font-size: 14px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 12px;
    background: #1D6A4C;
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button:active { filter: brightness(.94); }
  #error { color: #C0392B; font-size: 13px; margin: -4px 0 12px; display: none; }
</style>
</head>
<body>
<form id="loginForm">
  <h1>💅 Админка салона</h1>
  <input type="password" id="password" placeholder="Пароль" autofocus>
  <div id="error">Неверный пароль</div>
  <button type="submit">Войти</button>
</form>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const errorEl = document.getElementById('error');
    errorEl.style.display = 'none';
    const res = await fetch('/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    if (res.ok) {
      window.location.href = '/admin';
    } else {
      errorEl.style.display = 'block';
    }
  });
</script>
</body>
</html>
