# Single admin origin. The dashboard shell and its assets are static; each
# salon is reachable under /s/<slug>/ and proxied to that salon's container.
# Same origin for everything, so the panel needs no CORS.
#
# Slugs are listed explicitly on purpose: a regex location that took the
# container name from the URL would let anyone probe arbitrary containers on
# the compose network. The $up_<slug> variables below hold a constant each —
# they exist for the resolver, not to make the upstream user-controlled.

server {
    listen 80;
    server_name ADMIN_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ADMIN_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/ADMIN_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ADMIN_DOMAIN/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;

    # Docker's embedded DNS. A hostname written straight into proxy_pass is
    # resolved once at startup and then cached for the life of the process,
    # so a `docker compose up -d` that recreates the salon containers leaves
    # nginx proxying to their old addresses — and since the addresses get
    # handed back out, one salon's panel can end up served by another
    # salon's container. Going through a variable defers resolution to
    # request time, and `valid=` caps how long an answer is reused.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Admin shell (salon-independent, served straight off disk) ──────
    # The manifest's start_url is /admin, so the installed PWA opens there
    # rather than at /. Both spellings serve the same shell: the prefix
    # location below only matches /admin/<asset>, and /srv/admin holds no
    # index.html for /admin/ to fall back on.
    location = / {
        root /srv/admin;
        try_files /admin-dashboard.html =404;
    }

    location = /admin {
        root /srv/admin;
        try_files /admin-dashboard.html =404;
    }

    location = /admin/ {
        root /srv/admin;
        try_files /admin-dashboard.html =404;
    }

    # Assets keep their /admin/ prefix so the same markup also works when
    # served directly by a container during local development.
    location /admin/ {
        alias /srv/admin/;
    }

    # ── Per-salon API ──────────────────────────────────────────────────
    # `rewrite ... break` strips the /s/<slug> prefix (the query string comes
    # along on its own), so the container sees its own normal paths. It does
    # the job the trailing slash on proxy_pass used to: once the upstream is
    # a variable, nginx no longer rewrites the URI itself.
    location /s/aruuke/ {
        set $up_aruuke salon-aruuke:3000;
        rewrite ^/s/aruuke/(.*)$ /$1 break;
        proxy_pass http://$up_aruuke;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /s/astra/ {
        set $up_astra salon-astra:3000;
        rewrite ^/s/astra/(.*)$ /$1 break;
        proxy_pass http://$up_astra;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # scripts/new-salon.sh inserts above this line — keep it.
    # >>> salons >>>
}
