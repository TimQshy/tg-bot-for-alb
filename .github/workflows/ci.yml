name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Syntax check (runs on every push & PR) ───────────────────────────
  check:
    name: Syntax check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Check JS syntax
        run: |
          for f in $(find src -name '*.js'); do
            node --input-type=module --check < "$f" && echo "OK: $f"
          done

  # ── 2. Deploy — manual, not triggered by this workflow ──────────────────
  # Hosted on Railway, deployed via `railway up` (not git-push autodeploy).
  # See IMPLEMENTATION_PLAN.md, "Деплой" section.
